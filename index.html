<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Deployment Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a1628;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 60px 40px;
      border: 1px solid #1e3a5f;
      border-radius: 16px;
      background: #0d2137;
      max-width: 480px;
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
    }
    .badge {
      display: inline-block;
      background: #1a3a5c;
      border: 1px solid #2563eb;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 12px;
      color: #60a5fa;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 12px; color: #93c5fd; }
    .check { color: #3b82f6; font-size: 3rem; margin-bottom: 20px; }
    p { color: #94a3b8; line-height: 1.6; font-size: 0.95rem; }
    .meta { margin-top: 32px; font-size: 0.8rem; color: #1e40af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">OpenClaw · Deployment Test</div>
    <div class="check">✓</div>
    <h1>Pipeline Works</h1>
    <p>This page was created by OpenClaw, pushed to GitHub, and deployed to Vercel automatically.</p>
    <div class="meta">GitHub → Vercel · ayoadeking</div>
  </div>
</body>
</html>
